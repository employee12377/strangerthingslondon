<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title></title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Font (Closest Web Alternative to ITC Benguiat Bold Condensed) -->
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&display=swap" rel="stylesheet">

<style>
html, body {
    margin: 0;
    padding: 0;
    background: #000;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    font-family: 'Cinzel', serif;
}

#countdown {
    color: #ff1a1a;
    font-size: 6vw;
    letter-spacing: 8px;
    text-align: center;
    text-shadow:
        0 0 5px #ff0000,
        0 0 10px #ff0000,
        0 0 20px #ff0000,
        0 0 40px #990000,
        0 0 80px #660000;
}
</style>
</head>
<body>

<div id="countdown"></div>

<script>
// End Date: December 6, 2026 at 00:00:00 UTC
const endDate = new Date(Date.UTC(2026, 11, 6, 0, 0, 0));
const countdownElement = document.getElementById("countdown");

function updateCountdown() {
    const now = new Date();
    const utcNow = new Date(now.getTime() + (now.getTimezoneOffset() * 60000));
    let difference = endDate - utcNow;

    if (difference <= 0) {
        countdownElement.innerHTML = "000 : 00 : 00 : 00";
        clearInterval(interval);
        return;
    }

    const days = Math.floor(difference / (1000 * 60 * 60 * 24));
    const hours = Math.floor((difference / (1000 * 60 * 60)) % 24);
    const minutes = Math.floor((difference / (1000 * 60)) % 60);
    const seconds = Math.floor((difference / 1000) % 60);

    countdownElement.innerHTML =
        String(days).padStart(3, '0') + " : " +
        String(hours).padStart(2, '0') + " : " +
        String(minutes).padStart(2, '0') + " : " +
        String(seconds).padStart(2, '0');
}

const interval = setInterval(updateCountdown, 1000);
updateCountdown();
</script>

</body>
</html>
